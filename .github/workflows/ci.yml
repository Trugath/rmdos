name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends make binutils python3

      - name: Init k8086 submodule
        run: git submodule update --init emulator/k8086

      - name: Build bios + os
        run: make bios os

      - name: Check artifacts
        run: |
          set -euo pipefail
          for f in firmware/build/os.img firmware/build/u18.bin firmware/build/u19.bin firmware/build/fdrom.bin; do
            test -f "$f"
            ls -la "$f"
          done
